name: Release Linux packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn check
      - name: Build Linux deb, rpm, and AppImage
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:linux
      - name: Verify Linux packages install standard hicolor icons
        run: |
          set -euo pipefail
          deb="$(find dsh-plugin-desktop/dist -maxdepth 1 -name 'DSH-Desktop-*.deb' | head -n 1)"
          rpm="$(find dsh-plugin-desktop/dist -maxdepth 1 -name 'DSH-Desktop-*.rpm' | head -n 1)"
          test -n "$deb" && test -n "$rpm"
          deb_icons="$(dpkg-deb -c "$deb" | grep -cE 'usr/share/icons/hicolor/(16x16|24x24|32x32|48x48|64x64|128x128|256x256|512x512)/apps/' || true)"
          rpm_icons="$(rpm -qlp "$rpm" | grep -cE 'usr/share/icons/hicolor/(16x16|24x24|32x32|48x48|64x64|128x128|256x256|512x512)/apps/' || true)"
          echo "deb hicolor icon entries: $deb_icons; rpm hicolor icon entries: $rpm_icons"
          test "$deb_icons" -ge 8
          test "$rpm_icons" -ge 8
      - name: Verify the tag matches the packaged version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match version $version"; exit 1; }
      - name: Publish to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            dsh-plugin-desktop/dist/DSH-Desktop-*.deb \
            dsh-plugin-desktop/dist/DSH-Desktop-*.rpm \
            dsh-plugin-desktop/dist/DSH-Desktop-*.AppImage
