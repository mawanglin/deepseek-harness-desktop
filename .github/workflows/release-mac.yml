name: Release macOS package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn check
      - name: Build unsigned universal macOS DMG
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - name: Verify the tag matches the packaged version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match version $version"; exit 1; }
      - name: Publish to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            dsh-plugin-desktop/dist/mac-smoke/*.dmg
